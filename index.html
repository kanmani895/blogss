<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    body {
      margin:10px;
      padding:10px;
      background-color: hsl(0, 0%, 8%);
      display: flex table;
      justify-content: center;
      height: 100vh;
      color: white;
      border-radius: 50%;
      text-align: center;
      background-color:hsl(0, 0%, 12%);
    }
    .photo
    {
       background-color:hsl(0, 0%, 12%);
       border-radius: 50%;
       align-items: center;
       object-fit: cover;
       border: 10px;
    }
    .button
    {
      display: block;
      width: 100%;
      background-color:hsl(0, 0%, 20%);
      color:white;
      padding:12px;
      border:none;
      border-radius:5px;
      font-weight:bold;
      margin-bottom:10px;
      text-decoration: none;
    }
    .button:hover
    {
      text-decoration: underline;
      color: red;
      transition: all 0.15s;
    }

  </style>
</head>
<body>
  <div>
    <div class="photo"
       style="display:flexbox; flex-direction:column; align-items:center; justify-content:center;">
        <img src="./assets/images/avatar-jessica.jpeg"
          style="border-radius: 50%; align-items:center; flex-direction:column; justify-content:center; margin-top:25px;" width="100" height="100">
    </div>
  </div>
  <h1 style="color: white; text-align:center;">Jessica Randall</h1>
  <h3 style="color: hsl(75, 94%, 57%); text-align:center;">London, United Kingdom</h3>
  <p style="color: white; text-align:center;">"Front-end developer and avid reader."</p>
  <div>
    <a href="https://github.com/kanmani895" class="button">Github</a>
    <a href="https://www.frontendmentor.io/profile/kanmani895" class="button">Frontend Mentor</a>
    <a href="https://www.linkedin.com/in/kanmani-sakthivel-845408353/" class="button">Linkedin</a>
    <a href="https://x.com/?lang=en-in" class="button">Twitter</a>
    <a href="https://www.instagram.com/" class="button">Instagram</a>
  </div>
  
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>
</body>
</html>
